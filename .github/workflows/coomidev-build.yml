name: CoomiDev APK

# 用途：在云端构建隔离的 CoomiDev 预览包（包名 com.coomidev.android，端口 18765），
# 与正式版 com.coomi.android 完全隔离，装上不会影响现有 Coomi。
#
# 触发：推到 codex/custom-* 分支自动跑；或在 Actions 页面手动 Run workflow。
# 产物：artifact `coomidev-apk`（APK + sha256），保留 14 天。
#
# 关于 Runtime V2 资产：APK 必须内置 PRoot 宿主 + Ubuntu rootfs，Gradle 会按
# apps/coomi-app/app/src/main/assets/runtime-v2-manifest.json 校验 size/sha256。
# 上游发布的资产地址（releases/download/runtime-v2-ubuntu-noble-20260907/...）已经 404，
# 因此本工作流先尝试复用官方资产，失败则用仓库自己的锁定脚本重建，并用重建结果覆盖
# manifest，保证「文件内容 = manifest 声明」始终成立。
#
# 签名：预览包使用仓库内公开的 testkey_untrusted.jks（其口令是公开信息，见历史提交
# 97045df），仅供可安装性验证，切勿用于正式分发；正式签名密钥不进入 CI。

on:
  workflow_dispatch:
    inputs:
      upload_apk:
        description: Upload the built APK as a workflow artifact
        required: false
        default: true
        type: boolean
      force_runtime_rebuild:
        description: Rebuild PRoot host + Ubuntu rootfs even if the pinned assets are reachable
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "codex/custom-*"

permissions:
  contents: read

concurrency:
  group: coomidev-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNTIME_VERSION: ubuntu-noble-20260907-proot-5.1.107.91

jobs:
  # ---------------------------------------------------------------------------
  # 1) 准备 Runtime V2 资产（PRoot 宿主 119KB + Ubuntu rootfs 约 300MB）
  # ---------------------------------------------------------------------------
  runtime-assets:
    name: Prepare Runtime V2 assets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      reused_pinned: ${{ steps.pinned.outputs.reused }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Try the pinned upstream assets first
        id: pinned
        run: |
          set -euo pipefail
          MANIFEST=apps/coomi-app/app/src/main/assets/runtime-v2-manifest.json
          mkdir -p runtime-v2-dist
          python3 - "$MANIFEST" <<'PY' > /tmp/urls.txt
          import json, sys
          data = json.load(open(sys.argv[1]))
          for key, name in (("host", "proot-host-arm64.tar.gz"), ("rootfs", "ubuntu-noble-arm64.tar.gz")):
              print(name, data[key]["url"], data[key]["sha256"], data[key]["size"])
          PY
          ok=1
          while read -r name url sha size; do
            if curl -fLs --retry 2 --retry-delay 3 --max-time 900 -o "runtime-v2-dist/$name" "$url"; then
              actual=$(sha256sum "runtime-v2-dist/$name" | cut -d' ' -f1)
              bytes=$(stat -c%s "runtime-v2-dist/$name")
              if [ "$actual" = "$sha" ] && [ "$bytes" = "$size" ]; then
                echo "[ok] pinned $name reused ($bytes bytes)"
                continue
              fi
              echo "[warn] $name downloaded but does not match the manifest (sha $actual/$sha size $bytes/$size)"
            else
              echo "[warn] pinned URL unreachable for $name: $url"
            fi
            ok=0
            rm -f "runtime-v2-dist/$name"
          done < /tmp/urls.txt
          if [ "$ok" = "1" ]; then
            cp "$MANIFEST" runtime-v2-dist/runtime-v2-manifest.json
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "Pinned assets unavailable; will rebuild from the repository's pinned scripts."
          fi

      - name: Install rootfs build tooling
        if: steps.pinned.outputs.reused != 'true' || inputs.force_runtime_rebuild
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap qemu-user-static binfmt-support \
            debian-archive-keyring ubuntu-keyring jq
          sudo update-binfmts --enable qemu-aarch64 || true
          docker version || { echo "docker is required to build the PRoot host" >&2; exit 1; }

      - name: Build PRoot host (pinned Termux recipe, docker builder)
        if: steps.pinned.outputs.reused != 'true' || inputs.force_runtime_rebuild
        run: scripts/runtime-v2/build-proot-host.sh

      - name: Build Ubuntu rootfs (mmdebstrap + qemu-user-static)
        if: steps.pinned.outputs.reused != 'true' || inputs.force_runtime_rebuild
        run: sudo --preserve-env=RUNTIME_V2_OUTPUT scripts/runtime-v2/build-rootfs.sh

      - name: Generate manifest for the rebuilt assets
        if: steps.pinned.outputs.reused != 'true' || inputs.force_runtime_rebuild
        env:
          RUNTIME_V2_BASE_URL: https://github.com/${{ github.repository }}/releases/download/coomidev-runtime-ubuntu-noble-20260907-proot-5.1.107.91
          RUNTIME_V2_VERSION: ubuntu-noble-20260907-proot-5.1.107.91
        run: |
          scripts/runtime-v2/create-manifest.sh
          ls -l runtime-v2-dist

      - name: Summarize runtime assets
        run: |
          {
            echo "### Runtime V2 assets"
            echo
            echo "- pinned upstream assets reused: \`${{ steps.pinned.outputs.reused }}\`"
            echo
            echo '```'
            ls -l runtime-v2-dist
            cat runtime-v2-dist/runtime-v2-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime assets
        uses: actions/upload-artifact@v4
        with:
          name: runtime-v2-assets
          path: |
            runtime-v2-dist/proot-host-arm64.tar.gz
            runtime-v2-dist/ubuntu-noble-arm64.tar.gz
            runtime-v2-dist/runtime-v2-manifest.json
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2) 构建 CoomiDev APK
  # ---------------------------------------------------------------------------
  build-apk:
    name: Build CoomiDev APK
    needs: runtime-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      COOMI_DEV_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Rust 1.95.0 with the Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android
          components: clippy,rustfmt

      - name: Install Android SDK platform, build-tools and NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=""
          for candidate in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          test -x "$SDKMANAGER" || { echo "sdkmanager not found under $SDK" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Cache Gradle and Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            apps/coomi-rs/target
          key: coomidev-${{ runner.os }}-${{ hashFiles('apps/coomi-rs/Cargo.lock', 'apps/web/package-lock.json', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            coomidev-${{ runner.os }}-

      - name: Download Runtime V2 assets
        uses: actions/download-artifact@v4
        with:
          name: runtime-v2-assets
          path: runtime-v2-dist

      - name: Align the bundled manifest with the staged assets
        run: |
          set -euo pipefail
          MANIFEST=apps/coomi-app/app/src/main/assets/runtime-v2-manifest.json
          cp runtime-v2-dist/runtime-v2-manifest.json "$MANIFEST"
          python3 - "$MANIFEST" runtime-v2-dist <<'PY'
          import hashlib, json, os, sys
          manifest = json.load(open(sys.argv[1]))
          dist = sys.argv[2]
          for key, name in (("host", "proot-host-arm64.tar.gz"), ("rootfs", "ubuntu-noble-arm64.tar.gz")):
              path = os.path.join(dist, name)
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              size = os.path.getsize(path)
              assert manifest[key]["sha256"] == digest, f"{name}: sha256 mismatch"
              assert manifest[key]["size"] == size, f"{name}: size mismatch"
              print(f"[ok] {name} {size} bytes sha256={digest}")
          print("runtime version:", manifest["runtime_version"])
          PY
          ls -l runtime-v2-dist

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Web type-check
        run: npm run type-check --prefix apps/web

      # 前端单测失败不阻断 APK 产物，但会在日志里明确暴露。
      - name: Web unit tests (non-blocking)
        continue-on-error: true
        run: npm test --prefix apps/web

      - name: Stage signing configuration
        run: |
          set -euo pipefail
          # 公开的「不受信任测试密钥」口令（仓库历史提交里即可查到），仅用于预览包签名。
          cat > local.properties <<'EOF'
          coomi.signing.storePassword=xrj45yWGLbsO7W0v
          coomi.signing.keyPassword=xrj45yWGLbsO7W0v
          EOF
          test -f apps/coomi-app/app/testkey_untrusted.jks
          ls -l apps/coomi-app/app/testkey_untrusted.jks

      - name: Print resolved package and version
        run: ./gradlew --no-daemon :app:printVersionInfo

      - name: Build CoomiDev APK
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug

      - name: Verify APK identity and signature
        run: |
          set -euo pipefail
          SDK="$ANDROID_SDK_ROOT"
          APK=$(find apps/coomi-app/app/build/outputs/apk/debug -type f -name 'CoomiDev-*.apk' | sort | tail -n 1)
          test -n "$APK" || { echo "CoomiDev APK was not produced" >&2; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK_NAME=$(basename "$APK")" >> "$GITHUB_ENV"
          "$SDK/build-tools/36.0.0/aapt2" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.coomidev.android'" /tmp/badging.txt
          grep -q "arm64-v8a" /tmp/badging.txt
          "$SDK/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          ( cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" | tee "$(basename "$APK").sha256" )
          cat "$(dirname "$APK")/$(basename "$APK").sha256"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libcoomi.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtermux-bootstrap.so"
          unzip -l "$APK" | grep -q "assets/runtime-v2/ubuntu-noble-arm64.tgz"
          unzip -l "$APK" | grep -q "assets/runtime-v2/proot-host-arm64.tgz"
          unzip -l "$APK" | grep -q "assets/web.zip"

      - name: Build summary
        run: |
          {
            echo "### CoomiDev APK (preview)"
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- artifact: \`$APK_NAME\`"
            echo "- package: \`com.coomidev.android\` / label \`CoomiDev\` / port \`18765\`"
            echo "- runtime assets reused from upstream: \`${{ needs.runtime-assets.outputs.reused_pinned }}\`"
            echo "- signature: repository test key \`testkey_untrusted.jks\` (untrusted preview key)"
            echo "- sha256: \`$(cut -d' ' -f1 "$(dirname "$APK")/$(basename "$APK").sha256")\`"
            echo
            echo '```'
            cat /tmp/badging.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: ${{ inputs.upload_apk != false }}
        uses: actions/upload-artifact@v4
        with:
          name: coomidev-apk
          path: |
            apps/coomi-app/app/build/outputs/apk/debug/CoomiDev-*.apk
            apps/coomi-app/app/build/outputs/apk/debug/CoomiDev-*.apk.sha256
          if-no-files-found: error
          retention-days: 14
